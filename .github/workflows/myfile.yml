name: Python-test-pipeline

on: push

jobs:

  build:

    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Python install
        uses: actions/setup-python@v5
        with:
          python-install: '3.14'

      - name: Create virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Debug Python
        run: |
          which python3
          which pip3
          python3 --version
          pip3 --version

      - name: Run application
        run: |
          source venv/bin/activate
          python app.py
